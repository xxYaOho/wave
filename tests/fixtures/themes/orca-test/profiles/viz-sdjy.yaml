$schema: "https://www.designtokens.org/tr/2025.10/format/"

$helper:
  black:
    point:
      $description: 黑点, 色彩空间的亮度最低值
      $value: "#000000"
  white:
    point:
      $description: 白点, 色彩空间的亮度最高值, 影响色温
      $value: "#ffffff"

theme:
  shadow:
    elevation:
      "lowest":
        $type: shadow
        $value:
          color:
            $ref: "#/theme/color/shadow/$value"
            alpha: 0.02
          offsetX: 0
          offsetY: 0
          blur: 2
          spread: 1
        $extensions:
          smoothShadow:
            cubicBezier: "{wave.dimension.cubicBezier.easeInQuad}"
            step: 4
            target:
              alpha: 0.06
              offsetX: 0
              offsetY: 4
              blur: 8
              spread: -2
      "medium":
        $type: shadow
        $value:
          color:
            $ref: "#/theme/color/shadow/$value"
            alpha: 0.02
          offsetX: 0
          offsetY: 2
          blur: 4
          spread: -1
        $extensions:
          smoothShadow:
            cubicBezier: "{wave.dimension.cubicBezier.easeInQuad}"
            step: 4
            target:
              alpha: 0.06
              offsetX: 0
              offsetY: 8
              blur: 24
              spread: -6
  font:
    size:
      $type: dimension
      baseline:
        $value: "{wave.dimension.rem.7}"
        $type: dimension
      $extensions:
        platform:
          sketch:
            skip: true
