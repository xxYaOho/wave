$id: 7f7df8033767828ffa83943f8aabc386
$config:
  theme: test-standard
  resource:
    palette:
      - tailwindcss
    dimension:
      - wave
  parameter:
    outputDir: ./dist
    platform:
      - json
      - css
    colorSpace: hex

theme:
  color:
    $type: color
    primary:
      $id: 55a315c79d24ea7bb3bebd4f5d3d64b7
      $value: "{tailwindcss.color.indigo.600}"
      $description: "主品牌色"
    secondary:
      $id: e7c6042e52878461818a075ab10d69c5
      $value: "{tailwindcss.color.blue.500}"
    text:
      default:
        $id: b5c0ca5652022af19b685c54afaeb543
        $value: "{tailwindcss.color.gray.900}"
      muted:
        $id: 8274edaca9454437e45dc790f1324c4e
        $value:
          color: "{tailwindcss.color.gray.600}"
          alpha: 0.6
  style:
    shadow:
      $type: shadow
      sm:
        $id: 6e58bce7274dded3b1b7ceda3ba17e3c
        $value:
          - color:
              color: "#000000"
              alpha: 0.1
            offsetX: 0
            offsetY: 1
            blur: 2
            spread: 0
      md:
        $id: c6bfb850f854ebd20d171a3baf3a32dc
        $value:
          - color:
              $ref: "#/tailwindcss/color/gray/900/$value"
              alpha: 0.15
            offsetX: 0
            offsetY: 4
            blur: 6
            spread: 0
  dimension:
    $type: dimension
    alpha:
      $type: number
      sm:
        $id: 4faa49710ed40b16c3145f5a899973ab
        $value: "{wave.dimension.alpha.200}"
      md:
        $id: 3a752f75efa49ee244b9d4f91ee5475e
        $value: "{wave.dimension.alpha.400}"
      lg:
        $id: 0da7aa379ea09e2a2b3bd1904f022939
        $value: "{wave.dimension.alpha.600}"
