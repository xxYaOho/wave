$schema: "https://www.designtokens.org/tr/2025.10/format/"

$config:
  theme: sketch-extensions
  resource:
    palette:
      - tailwindcss
    dimension:
      - wave
  parameter:
    outputDir: ./theme
    night: false
    variants: false
  parameterGroup:
    json:
      platform:
        - json
      filterLayer: 1
      outputDir: ./theme/json
    css:
      platform:
        - css
      filterLayer: 2
      outputDir: ./theme/css
    sketch:
      platform:
        - sketch
      filterLayer: 1
      outputDir: ./theme/sketch

theme:
  color:
    $type: color
    primary:
      main:
        $value: "#1872f0"
        $extensions:
          sketch:
            path: "foundation/color"
    shadow:
      $value: "#0f172b"
  shadow:
    1:
      $type: shadow
      $value:
        color:
          $ref: "#/theme/color/shadow/$value"
          alpha: 0.02
        offsetX: 0
        offsetY: 0
        blur: 2
        spread: 1
      $extensions:
        sketch:
          path: "aaa/bbb"
        smoothShadow:
          cubicBezier: "{wave.dimension.cubicBezier.easeInQuad}"
          step: 4
          target:
            alpha: 0.06
            offsetX: 0
            offsetY: 4
            blur: 8
            spread: -2
  dimension:
    interaction:
      hover:
        $type: number
        $value: 0.16
        $extensions:
          sketch:
            path: "foundation/interaction"
            property:
              opacity: true
    radius:
      card:
        $type: dimension
        $value: 8
        $extensions:
          sketch:
            path: "foundation/radius"
            property:
              cornerRadius: true
  component:
    button:
      $type: color
      $extensions:
        composite: true
      background:
        $value: "{theme.color.primary.main}"
