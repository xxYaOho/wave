site:
  title: Wave Manual
  description: Wave 面向 UI/UX 设计师的本地设计交付手册。
  basePath: /

home:
  cards:
    - title: Design Token
      description: 读取 themefile 或带 $config 的 main.yaml，生成 json、jsonc、css 和 sketch 输出。
      href: /design-token
      command: wave dt doctor
    - title: 素材压缩
      description: 压缩 PNG、JPG、SVG 和 GIF，支持 dry-run、递归扫描和 SVG 图标清洗。
      href: /compress
      command: wave compress --help
    - title: 动效生成
      description: 从 PNG 帧目录生成 GIF 或 APNG。
      href: /motion
      command: wave motion --help
    - title: 工作区创建
      description: 按本地配置创建设计项目目录。
      href: /workspace
      command: wave workspace --help

