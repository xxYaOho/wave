$schema: "https://www.designtokens.org/tr/2025.10/format/"
theme:
  color:
    black:
      point:
        $description: 黑点, 色彩空间的亮度最低值
        $value:
          colorSpace: hsl
          components: [ 220, 45, 3 ]
        $type: color
    white:
      point:
        $description: 白点, 色彩空间的亮度最高值, 影响色温
        $value: "#ffffff"
        $type: color
    current:
      point:
        $description: 当前点
        $value:
          $ref: "#/theme/color/black/point/$value"
        $type: color
  dimension:
    interaction:
      $description: 通过 alpha 通道或透明度控制
      hover:
        $type: number
        $description: 悬浮
        $value: "{wave.dimension.alpha.100}"
        $extensions:
          platform:
            sketch:
              property:
                opacity: true
      press:
        $description: 按下
        $value: "{wave.dimension.alpha.200}"
        $extensions:
          platform:
            sketch:
              property:
                opacity: true
        $type: number
      focus:
        $type: number
        $description: 聚焦
        $value: "{wave.dimension.alpha.100}"
        $extensions:
          platform:
            sketch:
              property:
                opacity: true
      drag:
        $type: number
        $description: 拖拽
        $value: "{wave.dimension.alpha.500}"
        $extensions:
          platform:
            sketch:
              property:
                opacity: true
    shadow:
      "1":
        $type: shadow
        $value:
          color:
            $ref: "#/theme/color/shadow/$value"
            alpha: 0.12
          offsetX: 0
          offsetY: "{wave.dimension.px.1}"
          blur: "{wave.dimension.px.2}"
          spread: 0
        $extensions:
          smoothShadow:
            cubicBezier: "{wave.dimension.cubicBezier.easeOutQuad}"
            step: 3
      "2":
        $type: shadow
        $value:
          color:
            $ref: "#/theme/color/shadow/$value"
            alpha: 0.08
          offsetX: 0
          offsetY: "{wave.dimension.px.2}"
          blur: "{wave.dimension.px.4}"
          spread: -1
        $extensions:
          smoothShadow:
            cubicBezier: "{wave.dimension.cubicBezier.easeOutQuad}"
            step: 3
      "3":
        $type: shadow
        $value:
          color:
            $ref: "#/theme/color/shadow/$value"
            alpha: 0.08
          offsetX: 0
          offsetY: "{wave.dimension.px.3}"
          blur: "{wave.dimension.px.6}"
          spread: -2
        $extensions:
          smoothShadow:
            cubicBezier: "{wave.dimension.cubicBezier.easeOutQuad}"
            step: 3
      "4":
        $type: shadow
        $value:
          color:
            $ref: "#/theme/color/shadow/$value"
            alpha: 0.08
          offsetX: 0
          offsetY: "{wave.dimension.px.4}"
          blur: "{wave.dimension.px.8}"
          spread: -3
        $extensions:
          smoothShadow:
            cubicBezier: "{wave.dimension.cubicBezier.easeOutQuad}"
            step: 3
    gradient-mask-smooth:
      $description: 平滑渐变遮罩层
      $type: gradient
      $value:
        - color:
            $ref: "#/theme/color/black/point/$value"
            alpha: 0
          position: 0
        - color:
            $ref: "#/theme/color/black/point/$value"
            alpha: 1
          position: 0.5
      $extensions:
        smoothGradient:
          cubicBezier: "{wave.dimension.cubicBezier.easeInQuad}"
          step: 9
    gradient-mask-smooth-media:
      $description: 平滑渐变遮罩层, 播放器使用
      $type: gradient
      $value:
        - color:
            $ref: "#/theme/color/shadow/$value"
            alpha: 0
          position: 0
        - color:
            $ref: "#/theme/color/black/point/$value"
            alpha: 1
          position: 1
      $extensions:
        smoothGradient:
          cubicBezier: "{wave.dimension.cubicBezier.easeOutQuad}"
          step: 9
    border:
      width:
        xl:
          $type: dimension
          $value: "{wave.dimension.px.2}"
        lg:
          $type: dimension
          $value: "{wave.dimension.px.1}"
        md:
          $type: dimension
          $value: "{wave.dimension.px.0}"
    radius:
      max:
        $type: dimension
        $value:
          value: 9999
          unit: px
      zero:
        $type: dimension
        $value:
          value: 0
          unit: px
      xxl:
        $type: dimension
        $value: "{wave.dimension.px.8}"
      xl:
        $type: dimension
        $value: "{wave.dimension.px.7}"
      lg:
        $type: dimension
        $value: "{wave.dimension.px.6}"
      md:
        $type: dimension
        $value: "{wave.dimension.px.4}"
      sm:
        $type: dimension
        $value: "{wave.dimension.px.3}"
      xs:
        $type: dimension
        $value: "{wave.dimension.px.2}"
