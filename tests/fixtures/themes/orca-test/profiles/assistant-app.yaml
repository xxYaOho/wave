$schema: "https://www.designtokens.org/tr/2025.10/format/"
$config:
  resource:
    custom:
      - "/Users/teatao/Projects/my-color/orca/custom/mobile-assistant.yaml"
  base: e1dffd40322a93f588501e0d5fc72223
$helper:
  comment: 以 iOS 为设计基础, 研发自适配到其它平台(如鸿蒙, 安卓等)
  black:
    point:
      $description: 黑点, 色彩空间的亮度最低值
      $value: "#000000"
  white:
    point:
      $description:

      $value: "#ffffff"

theme:
  font:
    title:
      $description: "页面与内容层级标题"
      $extensions:
        platform:
          sketch:
            path: "title"
      large:
        $description: "页面主标题"
        $value:
          color: "{theme.color.text.emphasis}"
          fontSize: 34
          fontWeight: 700
          lineHeight:
            value: 41
            unit: px
          letterSpacing: 0
        $type: typography
      "1":
        $description: "一级标题"
        $value:
          color: "{theme.color.text.emphasis}"
          fontSize: 28
          fontWeight: 700
          lineHeight:
            value: 34
            unit: px
          letterSpacing: 0
        $type: typography
      "2":
        $description: "二级标题"
        $value:
          color: "{theme.color.text.emphasis}"
          fontSize: 22
          fontWeight: 700
          lineHeight:
            value: 28
            unit: px
          letterSpacing: 0
        $type: typography
      "3":
        $description: "三级标题"
        $value:
          color: "{theme.color.text.emphasis}"
          fontSize: 20
          fontWeight: 600
          lineHeight:
            value: 25
            unit: px
          letterSpacing: 0
        $type: typography
    text:
      headline:
        $description: "强调正文与列表标题"
        $value:
          color: "{theme.color.text.emphasis}"
          fontSize: 17
          fontWeight: 600
          lineHeight:
            value: 22
            unit: px

          letterSpacing: 0
        $type: typography
      callout:
        $description: "需要引起注意的辅助正文"
        $value:
          color: "{theme.color.text.default}"
          fontSize: 16
          fontWeight: 400
          lineHeight:
            value: 21
            unit: px
          letterSpacing: 0
        $type: typography
      subheadline:
        $description: "次级标题与辅助正文"
        $value:
          color: "{theme.color.text.default}"
          fontSize: 15
          fontWeight: 400
          lineHeight:
            value: 20
            unit: px
          letterSpacing: 0
        $type: typography
      footnote:
        $description: "脚注、时间与来源等元信息"
        $value:
          color: "{theme.color.text.subtle}"
          fontSize: 13
          fontWeight: 400
          lineHeight:
            value: 18
            unit: px
          letterSpacing: 0
        $type: typography
      caption-1:
        $description: "图片说明与辅助标签"
        $value:
          color: "{theme.color.text.subtle}"
          fontSize: 12
          fontWeight: 400
          lineHeight:
            value: 16
            unit: px
          letterSpacing: 0
        $type: typography
      caption-2:
        $description: "空间受限的弱辅助信息"
        $value:
          color: "{theme.color.text.subtlest}"
          fontSize: 11
          fontWeight: 400
          lineHeight:
            value: 13
            unit: px
          letterSpacing: 0
        $type: typography
  shadow:
    elevation:
      "lowest":
        $type: shadow
        $value:
          color:
            $ref: "#/theme/color/shadow/$value"
            alpha: 0.02
          offsetX: 0
          offsetY: 0
          blur: 2
          spread: 1
        $extensions:
          smoothShadow:
            cubicBezier: "{wave.dimension.cubicBezier.easeInQuad}"
            step: 4
            target:
              alpha: 0.06
              offsetX: 0
              offsetY: 4
              blur: 8
              spread: -2
      "medium":
        $type: shadow
        $value:
          color:
            $ref: "#/theme/color/shadow/$value"
            alpha: 0.02
          offsetX: 0
          offsetY: 2
          blur: 4
          spread: -1
        $extensions:
          smoothShadow:
            cubicBezier: "{wave.dimension.cubicBezier.easeInQuad}"
            step: 4
            target:
              alpha: 0.06
              offsetX: 0
              offsetY: 8
              blur: 24
              spread: -6
