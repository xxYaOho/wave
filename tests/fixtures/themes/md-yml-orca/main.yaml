$config:
  theme: orca-doc
  resource:
    dimension: [wave]
  parameter:
    outputDir: ./out
    platform: [md-yml]
    filterLayer: 1
theme:
  color:
    $type: color
    primary:
      main: { $value: "#1a72f0" }
      on-main: { $value: "#ffffff" }
    text:
      emphasis: { $value: "#112233" }
      muted:
        $value:
          $ref: "#/theme/color/text/emphasis/$value"
          alpha: 0.5
  radius:
    $type: dimension
    md: { $value: { value: 8, unit: px } }
  font:
    $type: typography
    $extensions:
      typography:
        fontFamily: "{theme.font.font-family}"
    font-family:
      $type: fontFamily
      $value: "{wave.dimension.fontFamily}"
    heading:
      h1:
        $value:
          color: "{theme.color.text.emphasis}"
          fontSize: "{wave.dimension.rem.13}"
          fontWeight: 700
          letterSpacing: { value: 0, unit: px }
          lineHeight: 1.2
  shadow:
    $type: shadow
    raised:
      $value:
        color: "{theme.color.text.emphasis}"
        offsetX: 0
        offsetY: 2
        blur: 4
        spread: 0
      $extensions:
        smoothShadow:
          cubicBezier: "{wave.dimension.cubicBezier.easeInQuad}"
          step: 2
