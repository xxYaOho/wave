$schema: "https://www.designtokens.org/tr/2025.10/format/"

$config:
  theme: profile-model
  resource:
    palette:
      - tailwindcss
    dimension:
      - wave
  parameter:
    outputDir: ./dist
    platform:
      - json
      - css
      - sketch
    filterLayer: 1

theme:
  color:
    $type: color
    primary:
      $value: "{tailwindcss.color.blue.600}"
      $id: a663e209afea84f42241e68b08ecf413
    on-primary:
      $value: "{tailwindcss.color.white}"
      $id: 69f1f2615fd01051747628c64fa9d01e
    outline:
      ring:
        $value: "{tailwindcss.color.blue.600}"
        $id: d11fa96ee2926241a32b1ce81729f102
  state:
    hover:
      $type: number
      $value: "{wave.dimension.alpha.100}"
      $extensions:
        platform:
          sketch:
            property:
              opacity: true
      $id: 7d953b5995480372931fe868aa7f5f46
  radius:
    md:
      $type: dimension
      $value: "{wave.dimension.px.4}"
      $id: d4736802b1d78e8e74ff8cfa66dc5a5b
  border:
    width:
      medium:
        $type: dimension
        $value: 1
        $id: aae79c8869b61e055b974e225d57ae7f
    outline:
      focus:
        $type: border
        $value:
          color: "{theme.color.outline.ring}"
          width: "{theme.border.width.medium}"
          style: solid
        $extensions:
          platform:
            sketch:
              outline:
                offset: 2
        $id: 14ca5985ac4fd358a2732b5ec77b8cd4
  shadow:
    elevation:
      low:
        $type: shadow
        $value:
          color: "{tailwindcss.color.black}"
          offsetX: 0
          offsetY: 1
          blur: 2
          spread: 0
        $id: 09e014e34f9372ff234461a62a8cba1c
  gradient:
    mask:
      soft:
        $type: gradient
        $value:
          - color: "#00000000"
            position: 0
          - color: "#000000ff"
            position: 1
        $id: 726cdb336303242fddfa1244fbebeb98
  font:
    heading:
      h1:
        $type: typography
        $value:
          fontFamily: Helvetica
          fontSize:
            value: 32
            unit: px
          fontWeight: 900
          lineHeight:
            value: 40
            unit: px
          letterSpacing: 0
        $id: 624364eea75b4d20ec4d0bfbc5e8cc81

doctor:
  wcagPairs:
    primary:
      foreground: "{theme.color.on-primary}"
      background: "{theme.color.primary}"
$id: 6e21ea573d92ec20131b87849addfc09
