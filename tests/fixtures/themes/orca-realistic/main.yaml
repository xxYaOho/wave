$schema: "https://www.designtokens.org/tr/2025.10/format/"

$config:
  theme: orca-realistic
  resource:
    palette:
      - tailwindcss
    dimension:
      - wave
    custom:
      - ./custom/orca-brand.yaml
  parameter:
    outputDir: ./theme
    filterLayer: 1
  parameterGroup:
    json:
      platform:
        - json
        - jsonc
      outputDir: ./theme/json
      filterLayer: 1
    css:
      platform:
        - css
      outputDir: ./theme/css
      filterLayer: 2
    sketch:
      platform:
        - sketch
      outputDir: ./theme/sketch
      filterLayer: 2

theme:
  color:
    $type: color
    $extensions:
      sketch:
        path: "foundation/color"
    transparent:
      $value: "#00000000"
    primary:
      main:
        $value: "{orca-brand.color.main.600}"
      on-main:
        $value: "{tailwindcss.color.white}"
      container:
        $value: "{orca-brand.color.main.50}"
      on-container:
        $value: "{orca-brand.color.main.700}"
    orcaFallback:
      main:
        $value: "{orca-brand.color.main.600-fallback}"
        $extensions:
          sketch:
            path: "foundation/color"
    text:
      default:
        $value: "{tailwindcss.color.slate.900}"
      emphasis:
        $value: "{orca-brand.color.main.500}"
      subtlest:
        $value: "#7a869a"
      "escaped.key/~color":
        $value: "#12ab34"
      disabled:
        $value:
          $ref: "#/theme/color/text/default/$value"
          alpha: "{wave.dimension.alpha.400}"
    outline:
      default:
        $value: "#ff00ff"
        $extensions:
          inheritColor:
            property:
              opacity: "{wave.dimension.alpha.400}"
    surface:
      default:
        $value:
          colorSpace: hsl
          components: [210, 10, 96]
    scrim:
      $value:
        $ref: "#/theme/color/transparent/$value"
        alpha: "{wave.dimension.alpha.700}"
    inverse:
      surface:
        $value:
          color: "{tailwindcss.color.slate.900}"
          alpha: "{wave.dimension.alpha.800}"
  dimension:
    interaction:
      $extensions:
        sketch:
          path: "foundation/interaction"
      hover:
        $type: number
        $value: "{wave.dimension.alpha.100}"
        $extensions:
          sketch:
            property:
              opacity: true
      press:
        $type: number
        $value: "{wave.dimension.alpha.200}"
        $extensions:
          sketch:
            property:
              opacity: true
    radius:
      $extensions:
        sketch:
          path: "foundation/radius"
      card:
        $type: dimension
        $value: 8
        $extensions:
          sketch:
            property:
              cornerRadius: true
  font:
    $type: typography
    $extensions:
      typography:
        defaults:
          fontFamily: "{wave.dimension.fontFamily}"
          fontSize:
            value: 14
            unit: pt
          fontWeight: 400
          letterSpacing: 0
      sketch:
        path: "foundation/font"
        skip: true
    body:
      $value:
        lineHeight: 1.5
        color: "{theme.color.text.default}"
      $extensions:
        sketch:
          skip: false
    heading:
      $extensions:
        sketch:
          path: "v2/heading"
          skip: false
      h1:
        $value:
          lineHeight: 1.5
          color: "{theme.color.text.emphasis}"
      external:
        $value:
          lineHeight: 1.5
          color: "{orca-brand.color.main.500}"
      literal:
        $value:
          lineHeight: 1.5
          color: "#d12f6a"
      alpha:
        $value:
          lineHeight: 1.5
          color:
            $ref: "#/theme/color/text/default"
            alpha: 0.5
      escaped:
        $value:
          lineHeight: 1.5
          color:
            $ref: "#/theme/color/text/escaped.key~1~0color"
    display:
      $extensions:
        sketch:
          path: "v2/display"
          skip: false
      body:
        $value:
          lineHeight: 1.5
          color:
            $ref: "#/theme/color/text/default"
      footnote:
        $value:
          lineHeight: 1.5
          color:
            $ref: "#/theme/color/text/subtlest/$value"
    label:
      $value:
        lineHeight:
          value: 20
          unit: px
      $extensions:
        sketch:
          skip: false
    internal:
      $value:
        lineHeight: 1.25
  border:
    $type: border
    $extensions:
      sketch:
        path: "foundation/border"
    antline:
      $value:
        color: "{theme.color.primary.main}"
        width:
          value: 1
          unit: px
        style:
          dashArray:
            - value: 4
              unit: px
            - value: 8
              unit: px
    outline:
      $value:
        color: "{theme.color.primary.main}"
        width:
          value: 1
          unit: px
        style: solid
      $extensions:
        outline:
          offset: 2
  shadow:
    $extensions:
      sketch:
        path: "foundation/shadow"
    raised:
      $type: shadow
      $value:
        color:
          $ref: "#/theme/color/orcaFallback/main/$value"
          alpha: 0.5
        offsetX: 0
        offsetY: 0
        blur: 2
        spread: 1
      $extensions:
        smoothShadow:
          cubicBezier: "{wave.dimension.cubicBezier.easeInQuad}"
          step: 4
          target:
            alpha: 0.06
            offsetX: 0
            offsetY: 4
            blur: 8
            spread: -2
  gradient:
    $type: gradient
    $extensions:
      sketch:
        path: "foundation/gradient"
    mask:
      $value:
        - color:
            $ref: "#/theme/color/transparent/$value"
            alpha: 0
          position: 0
        - color:
            $ref: "#/theme/color/transparent/$value"
            alpha: 1
          position: 1
      $extensions:
        smoothGradient:
          cubicBezier: "{wave.dimension.cubicBezier.easeInOutCubic}"
          step: 4
    fallback:
      $value:
        - color:
            $ref: "#/theme/color/orcaFallback/main/$value"
            alpha: 0.25
          position: 0
        - color: "#ffffff"
          position: 1
