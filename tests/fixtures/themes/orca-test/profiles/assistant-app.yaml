$schema: "https://www.designtokens.org/tr/2025.10/format/"
$config:
  resource:
    custom:
      - "/Users/teatao/Projects/my-color/orca/custom/mobile-assistant.yaml"
$helper:
  comment: 以 iOS 为设计基础, 研发自适配到其它平台(如鸿蒙, 安卓等)
  black:
    point:
      $description: 黑点, 色彩空间的亮度最低值
      $value: "#000000"
  white:
    point:
      $description:

      $value: "#ffffff"

theme:
  color:
    $type: color
    $description: light mode
    primary:
      $description: 主色, 品牌色.
      main:
        $value: "{mobile-assistant.color.main.600}"
      on-main:
        $value: "{tailwindcss.color.white}"
      container:
        $value: "{mobile-assistant.color.main.50}"
      on-container:
        $value: "{mobile-assistant.color.main.600}"
    secondary:
      $description: 辅助色, 与主色 (品牌色)配合
      main:
        $value: "{mobile-assistant.color.sub.400}"
      on-main:
        $value: "{mobile-assistant.color.sub.950}"
      container:
        $value: "{mobile-assistant.color.sub.50}"
      on-container:
        $value: "{mobile-assistant.color.sub.700}"
    neutral:
      $description: 中性自然色, 适应大多数色彩
      main:
        $value: "{tailwindcss.color.gray.800}"
      on-main:
        $value: "{tailwindcss.color.gray.50}"
      container:
        $value: "{tailwindcss.color.gray.50}"
      on-container:
        $value: "{tailwindcss.color.gray.500}"
    error:
      $description: 错误, 严重提示. 多数情况下 hue='0-5'
      main:
        $value: "{tailwindcss.color.red.600}"
      on-main:
        $value: "{tailwindcss.color.white}"
      container:
        $value: "{tailwindcss.color.red.50}"
      on-container:
        $value: "{tailwindcss.color.red.500}"
    warning:
      $description: 警告, 重度提示. 多数情况下 hue='10-20'
      main:
        $value: "{tailwindcss.color.orange.600}"
      on-main:
        $value: "{tailwindcss.color.orange.950}"
      container:
        $value: "{tailwindcss.color.orange.50}"
      on-container:
        $value: "{tailwindcss.color.orange.600}"
    attention:
      $description: 注意, 轻度提示. 多数情况下 hue='35-45'
      main:
        $value: "{tailwindcss.color.yellow.500}"
      on-main:
        $value: "{tailwindcss.color.yellow.950}"
      container:
        $value: "{tailwindcss.color.yellow.100}"
      on-container:
        $value: "{tailwindcss.color.yellow.700}"
    success:
      $description: 安全. 多数情况下 hue='150-160'
      main:
        $value: "{tailwindcss.color.green.600}"
      on-main:
        $value: "{tailwindcss.color.white}"
      container:
        $value: "{tailwindcss.color.green.50}"
      on-container:
        $value: "{tailwindcss.color.green.600}"
    info:
      $description: 安全. 多数情况下 hue='150-160'
      main:
        $value: "{tailwindcss.color.sky.600}"
      on-main:
        $value: "{tailwindcss.color.white}"
      container:
        $value: "{tailwindcss.color.sky.50}"
      on-container:
        $value: "{tailwindcss.color.sky.600}"
    text:
      $description: 文本
      emphasis:
        $value: "{tailwindcss.color.gray.950}"
      default:
        $value: "{tailwindcss.color.gray.900}"
      subtle:
        $value: "{tailwindcss.color.gray.700}"
      subtlest:
        $value: "{tailwindcss.color.gray.500}"
      disabled:
        $value:
          $ref: "#/theme/color/text/default/$value"
          alpha: "{wave.dimension.alpha.400}"
    border:
      $description: 边框
      emphasis:
        $description: 强
        $value:
          $ref: "#/theme/color/neutral/main/$value"
          alpha: "{wave.dimension.alpha.300}"
      default:
        $description: 默认
        $value:
          $ref: "#/theme/color/neutral/main/$value"
          alpha: "{wave.dimension.alpha.200}"
      subtle:
        $description: 弱
        $value:
          $ref: "#/theme/color/neutral/main/$value"
          alpha: "{wave.dimension.alpha.100}"
    outline:
      default:
        $description: 带品牌色调取向的焦点环
        $value:
          color: "{theme.color.primary.main}"
          alpha: "{wave.dimension.alpha.400}"
      ring:
        $description: 带品牌色调取向的焦点环
        $value: "{theme.color.primary.main}"
    surface:
      $description: 背景层
      default:
        $description: 主背景, 基于 deepGray.light.100 的微调
        $value:
          colorSpace: hsl
          components: [240, 10, 94]
      dim:
        $description: 下降层, 用于需要降低亮度的区域
        $value:
          colorSpace: hsl
          components: [240, 10, 92]
      bright:
        $description: 提升层, 用于需要提高亮度的区域
        $value:
          colorSpace: hsl
          components: [240, 10, 96]
    container:
      $description: 容器, 框架层
      highest:
        $description: 最高层级, 比如 modal, dialog
        $value: "{tailwindcss.color.white}"
      high:
        $description: 抬升层级, 比如 popover, dropdown
        $value: "{tailwindcss.color.white}"
      default:
        $description: 标准层级, 用于大多数组件的默认容器
        $value: "{tailwindcss.color.white}"
      low:
        $description: 次级层级, 比如 card, list, table
        $value: "{tailwindcss.color.white}"
      lowest:
        $description: 最低层级(视觉下沉), 比如 input-field
        $value: "{tailwindcss.color.white}"
    scrim:
      $description: 半透明遮罩,用于 modal/drawer 背景
      $value:
        color: "{tailwindcss.color.black}"
        alpha: "{wave.dimension.alpha.700}"
    shadow:
      $description: 主题色倾向
      $value: "{tailwindcss.color.slate.900}"
    inverse:
      surface:
        $description: 反色背景(通常是深色), 比如 Snackbar, Toast
        $value:
          color: "{tailwindcss.color.slate.900}"
          alpha: "{wave.dimension.alpha.800}"
      on-surface:
        $value: "{tailwindcss.color.white}"
      primary:
        $description: 反色主色, 比如 media-play-progress-bar
        $value: "{mobile-assistant.color.main.100}"
  radius:
    $description: "圆角"
    $type: dimension
    $extensions:
      sketch:
        path: "radius"
    max:
      $value:
        value: 9999
        unit: px
    xxl:
      $value: "{wave.dimension.px.9}"
    xl:
      $value: "{wave.dimension.px.7}"
    lg:
      $value: "{wave.dimension.px.5}"
    md:
      $value: "{wave.dimension.px.4}"
    sm:
      $value: "{wave.dimension.px.3}"
    xs:
      $value: "{wave.dimension.px.2}"
    xxs:
      $value: "{wave.dimension.px.1}"
    zero:
      $value:
        value: 0
        unit: px
  font:
    $type: typography
    $description: "应用文本样式, 以 iOS 默认文本层级为基础"
    $extensions:
      typography:
        defaults:
          fontFamily: "PingFang SC"
    title:
      $description: "页面与内容层级标题"
      $extensions:
        sketch:
          path: "title"
      large:
        $description: "页面主标题"
        $value:
          color: "{theme.color.text.emphasis}"
          fontSize: 34
          fontWeight: 700
          lineHeight:
            value: 41
            unit: px
          letterSpacing: 0
      1:
        $description: "一级标题"
        $value:
          color: "{theme.color.text.emphasis}"
          fontSize: 28
          fontWeight: 700
          lineHeight:
            value: 34
            unit: px
          letterSpacing: 0
      2:
        $description: "二级标题"
        $value:
          color: "{theme.color.text.emphasis}"
          fontSize: 22
          fontWeight: 700
          lineHeight:
            value: 28
            unit: px
          letterSpacing: 0
      3:
        $description: "三级标题"
        $value:
          color: "{theme.color.text.emphasis}"
          fontSize: 20
          fontWeight: 600
          lineHeight:
            value: 25
            unit: px
          letterSpacing: 0
    text:
      $description: "正文、标签与辅助信息"
      $extensions:
        sketch:
          path: "display"
      headline:
        $description: "强调正文与列表标题"
        $value:
          color: "{theme.color.text.emphasis}"
          fontSize: 17
          fontWeight: 600
          lineHeight:
            value: 22
            unit: px

          letterSpacing: 0
      body:
        $description: "主要正文与对话内容"
        $value:
          color: "{theme.color.text.default}"
          fontSize: 17
          fontWeight: 400
          lineHeight:
            value: 22
            unit: px
          letterSpacing: 0
      callout:
        $description: "需要引起注意的辅助正文"
        $value:
          color: "{theme.color.text.default}"
          fontSize: 16
          fontWeight: 400
          lineHeight:
            value: 21
            unit: px
          letterSpacing: 0
      subheadline:
        $description: "次级标题与辅助正文"
        $value:
          color: "{theme.color.text.default}"
          fontSize: 15
          fontWeight: 400
          lineHeight:
            value: 20
            unit: px
          letterSpacing: 0
      footnote:
        $description: "脚注、时间与来源等元信息"
        $value:
          color: "{theme.color.text.subtle}"
          fontSize: 13
          fontWeight: 400
          lineHeight:
            value: 18
            unit: px
          letterSpacing: 0
      caption-1:
        $description: "图片说明与辅助标签"
        $value:
          color: "{theme.color.text.subtle}"
          fontSize: 12
          fontWeight: 400
          lineHeight:
            value: 16
            unit: px
          letterSpacing: 0
      caption-2:
        $description: "空间受限的弱辅助信息"
        $value:
          color: "{theme.color.text.subtlest}"
          fontSize: 11
          fontWeight: 400
          lineHeight:
            value: 13
            unit: px
          letterSpacing: 0
  shadow:
    $description: "层级投影"
    $extensions:
      sketch:
        path: "shadow"
    elevation:
      "lowest":
        $type: shadow
        $value:
          color:
            $ref: "#/theme/color/shadow/$value"
            alpha: 0.02
          offsetX: 0
          offsetY: 0
          blur: 2
          spread: 1
        $extensions:
          smoothShadow:
            cubicBezier: "{wave.dimension.cubicBezier.easeInQuad}"
            step: 4
            target:
              alpha: 0.06
              offsetX: 0
              offsetY: 4
              blur: 8
              spread: -2
      "low":
        $type: shadow
        $value:
          color:
            $ref: "#/theme/color/shadow/$value"
            alpha: 0.02
          offsetX: 0
          offsetY: 1
          blur: 4
          spread: 0
        $extensions:
          smoothShadow:
            cubicBezier: "{wave.dimension.cubicBezier.easeInQuad}"
            step: 4
            target:
              alpha: 0.08
              offsetX: 0
              offsetY: 4
              blur: 12
              spread: -4
      "medium":
        $type: shadow
        $value:
          color:
            $ref: "#/theme/color/shadow/$value"
            alpha: 0.02
          offsetX: 0
          offsetY: 2
          blur: 4
          spread: -1
        $extensions:
          smoothShadow:
            cubicBezier: "{wave.dimension.cubicBezier.easeInQuad}"
            step: 4
            target:
              alpha: 0.06
              offsetX: 0
              offsetY: 8
              blur: 24
              spread: -6
      "high":
        $type: shadow
        $value:
          color:
            $ref: "#/theme/color/shadow/$value"
            alpha: 0.02
          offsetX: 0
          offsetY: 2
          blur: 6
          spread: -1
        $extensions:
          smoothShadow:
            cubicBezier: "{wave.dimension.cubicBezier.easeInQuad}"
            step: 4
            target:
              alpha: 0.06
              offsetX: 0
              offsetY: 16
              blur: 32
              spread: -8
      "highest":
        $type: shadow
        $value:
          color:
            $ref: "#/theme/color/shadow/$value"
            alpha: 0.02
          offsetX: 0
          offsetY: 6
          blur: 6
          spread: -2
        $extensions:
          smoothShadow:
            cubicBezier: "{wave.dimension.cubicBezier.easeInQuad}"
            step: 4
            target:
              alpha: 0.04
              offsetX: 0
              offsetY: 32
              blur: 48
              spread: -12
